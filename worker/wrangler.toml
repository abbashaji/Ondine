name = "ondine-gateway"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[workflows]]
name = "code-cell-workflow"
binding = "CODE_CELL_WORKFLOW"
class_name = "CodeCellWorkflow"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   MCP_BEARER_TOKEN, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN,
#   GROQ_API_KEY, GEMINI_API_KEY, GITHUB_TOKEN, GITHUB_REPO,
#   DISCORD_WEBHOOK_URL, POSTHOG_API_KEY
